<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kidtime</title>
  <meta name="description" content="Screen time for the kids' computers">
  <meta name="theme-color" content="#f4f3f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css?v=__ASSETS__">
</head>
<body>
  <header class="top">
    <h1>Kidtime</h1>
    <p class="updated" id="updated" aria-live="polite">Loading…</p>
  </header>
  <nav class="tabs" aria-label="Sections">
    <button type="button" class="tab" data-tab="today" aria-current="page">Today</button>
    <button type="button" class="tab" data-tab="rules">Rules</button>
    <button type="button" class="tab" data-tab="apps">Apps <span id="apps-new" class="badge" hidden></span></button>
  </nav>
  <main>
    <section id="tab-today">
      <div id="users" class="users"></div>
      <section class="card log">
        <h2>Send a message</h2>
        <form id="message-form" class="editor">
          <label>To <select name="to" id="message-to"></select></label>
          <label>Message <input type="text" name="text" maxlength="200" required placeholder="Dinner in 5 minutes"></label>
          <p class="form-error" id="message-error" role="alert" hidden></p>
          <button type="submit">Send</button>
        </form>
        <p class="footnote">Shown on the computer they're using, within about 15 seconds. Not shown after 10 minutes if they aren't at a computer.</p>
        <ul id="messages" class="events"></ul>
      </section>
      <section class="card log">
        <h2>What the rules did</h2>
        <p class="footnote">Kids with Enforce on are acted on. For the others this shows when kidtime would have acted.</p>
        <ul id="events" class="events"></ul>
      </section>
    </section>
    <section id="tab-rules" hidden></section>
    <section id="tab-apps" hidden></section>
  </main>
  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <script src="/app.js?v=__ASSETS__"></script>
  <script src="/manage.js?v=__ASSETS__"></script>
</body>
</html>
