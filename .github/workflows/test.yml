name: test

# Reusable gate, called by both publish-image.yml and release-please.yml, so a
# red main can neither publish an image nor cut a release tag.
on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly fmt --check
      - run: cargo +stable clippy --all-targets --all-features -- -D warnings
      - run: cargo +stable test --locked
